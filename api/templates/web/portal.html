<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Attendance — Faculty Attendance</title>
<link rel="icon" href="/static/img/image.png" type="image/png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --blue: #1a73e8;
    --blue-hover: #1558b0;
    --blue-tint: #e8f0fe;
    --surface: #ffffff;
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --border: #dadce0;
    --border-light: #edf0f2;
    --text: #202124;
    --muted: #5f6368;
    --danger: #d93025;
    --danger-tint: #fce8e6;
    --success: #188038;
    --success-tint: #e6f4ea;
    --warn: #b06000;
    --warn-tint: #fef7e0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(60,64,67,.1), 0 2px 6px rgba(60,64,67,.06);
    --nav-w: 230px;
  }

  body {
    margin: 0;
    font: 14px/1.5 "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Fixed Topbar ---- */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 100;
  }
  #menu-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border: 0;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    transition: background .15s;
    flex-shrink: 0;
  }
  #menu-toggle:hover { background: #f1f3f4; color: var(--text); }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
    text-decoration: none;
    flex-shrink: 0;
  }
  .brand-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 2px rgba(26,115,232,.2);
  }
  .spacer { flex: 1; }
  .who-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .btn-logout {
    padding: 5px 12px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all .15s;
    white-space: nowrap;
  }
  .btn-logout:hover {
    background: #f1f3f4;
    color: var(--text);
    border-color: #c0c4c9;
  }

  /* ---- Drawer Backdrop (Mobile) ---- */
  #sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32,33,36,.4);
    backdrop-filter: blur(2px);
    z-index: 89;
  }
  #sidebar-backdrop.open { display: block; }

  /* ---- Sidebar ---- */
  #sidebar {
    position: fixed;
    top: 56px; left: 0; bottom: 0;
    width: var(--nav-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y: auto;
    z-index: 90;
    transition: transform .25s ease;
    display: flex;
    flex-direction: column;
  }
  #sidebar nav { flex: 1; }
  .sidebar-footer {
    border-top: 1px solid var(--border-light);
    padding-top: 10px;
    margin-top: 10px;
  }
  .sidebar-footer .who-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .sidebar-footer .who-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-footer a.btn-about {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    margin-bottom: 4px;
    transition: background .15s;
  }
  .sidebar-footer a.btn-about:hover { background: rgba(32,33,36,.05); }
  .sidebar-footer .btn-logout { width: 100%; }
  .nav-section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 12px 4px;
  }
  .nav-divider {
    height: 1px;
    background: var(--border-light);
    margin: 8px 6px;
  }
  #sidebar nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    margin-bottom: 2px;
    transition: background .15s, color .15s;
    cursor: pointer;
    font-weight: 500;
  }
  #sidebar nav a:hover { background: rgba(32,33,36,.05); }
  #sidebar nav a.on {
    background: var(--blue-tint);
    color: var(--blue);
    font-weight: 600;
  }
  #sidebar nav a svg { flex-shrink: 0; opacity: .8; }
  #sidebar nav a.on svg { opacity: 1; stroke: var(--blue); }

  /* ---- Main Content ---- */
  #content {
    margin-top: 56px;
    margin-left: var(--nav-w);
    padding: 24px 28px 64px;
    min-height: calc(100vh - 56px);
  }

  /* ---- Profile Card / Header Banner ---- */
  .profile-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .profile-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .profile-avatar-lg {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(26,115,232,.3);
  }
  .profile-details h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .profile-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 12px;
    background: #f1f3f4;
    color: var(--muted);
    font-weight: 500;
  }
  .status-badge-lg {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .status-badge-lg.in {
    background: var(--success-tint);
    color: var(--success);
    border-color: #b7dfca;
  }
  .status-badge-lg.out {
    background: #f1f3f4;
    color: var(--muted);
    border-color: var(--border);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-badge-lg.in .status-dot {
    box-shadow: 0 0 0 3px rgba(24,128,56,.25);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.95); opacity: 1; }
    50% { transform: scale(1.15); opacity: .7; }
    100% { transform: scale(.95); opacity: 1; }
  }

  /* ---- Section Header ---- */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px 0 12px;
    gap: 12px;
  }
  .section-title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-date-sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }

  /* ---- Today Stats Grid (Compact & Dense) ---- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 1px 2px rgba(60,64,67,.06);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: transform .15s, box-shadow .15s;
  }
  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon.blue   { background: var(--blue-tint); color: var(--blue); }
  .stat-icon.green  { background: var(--success-tint); color: var(--success); }
  .stat-icon.purple { background: #f3e8fd; color: #8430ce; }
  .stat-icon.amber  { background: var(--warn-tint); color: var(--warn); }
  .stat-info { flex: 1; min-width: 0; }
  .stat-card .num {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-card .lbl {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 500;
  }

  /* ---- Read-only Calendar ---- */
  .cal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
  }
  .cal-nav-btn {
    padding: 5px 12px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .cal-nav-btn:hover { background: #f1f3f4; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 14px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-cell {
    min-height: 56px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: background .12s;
    border: 1px solid transparent;
  }
  .cal-cell:hover { background: #f1f6fd; }
  .cal-empty { cursor: default; }
  .cal-daynum { font-size: 13px; font-weight: 500; color: var(--text); }
  .cal-hours { font-size: 11px; font-weight: 600; color: var(--blue); }
  .cal-holiday { background: #fdeaea; }
  .cal-holiday .cal-daynum { color: var(--danger); }
  .cal-selected { border-color: var(--blue); }
  .cal-today .cal-daynum { text-decoration: underline; }
  .cal-detail {
    margin-top: 16px;
    padding: 14px 16px;
    background: #fafafa;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .cal-detail p { margin: 4px 0; }
  .cal-detail .muted-text { color: var(--muted); }

  /* Notices */
  #notice {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: #b45309;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #notice:empty { display: none; }
  #notice a { color: var(--blue); font-weight: 500; text-decoration: underline; }
  .msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin-bottom: 12px; }
  .msg.err { color: var(--danger); }
  .hidden { display: none !important; }

  /* ========================================================================
     MOBILE RESPONSIVENESS (≤ 768px & ≤ 480px)
     ======================================================================== */
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 768px) {
    :root { --nav-w: 0px; }
    #menu-toggle { display: inline-flex; }
    #sidebar {
      transform: translateX(-100%);
      width: 250px;
      box-shadow: 2px 0 16px rgba(0,0,0,.15);
    }
    #sidebar.open { transform: translateX(0); }
    #content {
      margin-left: 0;
      padding: 16px 14px 64px;
    }
    .profile-banner {
      padding: 16px;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .status-badge-lg {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 480px) {
    #content { padding: 12px 10px 48px; }
    .profile-avatar-lg { width: 40px; height: 40px; font-size: 16px; }
    .profile-details h1 { font-size: 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-card { padding: 12px 10px; gap: 8px; }
    .stat-card .num { font-size: 17px; }
    .stat-icon { width: 30px; height: 30px; border-radius: 6px; }
  }
</style>
</head>
<body>

<!-- Fixed Top bar -->
<header id="topbar">

  <a class="brand" href="#" style="display:flex; align-items:center; gap:8px;">
    <img src="/static/img/image.png" alt="Logo" style="width:24px; height:24px; object-fit:contain; border-radius:4px;">

  <div class="spacer"></div>
</header>

<!-- Drawer Backdrop for Mobile -->
<div id="sidebar-backdrop"></div>

<!-- Collapsible Sidebar -->
<aside id="sidebar">
  <nav id="nav">
    <a data-view="dashboard" id="nav-dashboard" class="on">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>
    <a data-view="calendar" id="nav-calendar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="16" r="1"/>
      </svg>
      Calendar
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="who-row">
      <div class="avatar" id="avatarInitial">U</div>
      <span id="who" style="display:none;"></span>
    </div>
    <a href="/about" class="btn-about" title="About System & Team">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      About
    </a>
    <button class="btn-logout" id="logout">Sign out</button>
  </div>
</aside>

<!-- Main Page Content -->
<main id="content">
  <div id="notice"></div>
  <div class="msg" id="msg"></div>

  <div id="dashboardView">
  <!-- Staff Profile & Live Status Banner -->
  <div class="profile-banner">
    <div class="profile-left">
      <div class="profile-avatar-lg" id="profileInitial">U</div>
      <div class="profile-details">
        <h1 id="profileName">Loading...</h1>
        <div class="profile-meta">
          <span class="meta-tag" id="profileDept">Department</span>
          <span class="meta-tag" id="profileEmpId">ID</span>
          <span class="meta-tag" id="profileFaceStatus">Face</span>
        </div>
      </div>
    </div>
    <div id="liveStatusContainer">
      <div class="status-badge-lg out" id="liveStatusBadge">
        <span class="status-dot"></span>
        <span id="liveStatusText">Checking status...</span>
      </div>
    </div>
  </div>

  <!-- Today Section Header -->
  <div class="section-header">
    <h2 class="section-title">
      Today's Overview
      <span class="section-date-sub" id="todayDate"></span>
    </h2>
  </div>

  <!-- 4 Compact Stat Cards -->
  <div class="stats-grid" id="todayStats">
    <div class="stat-card">
      <div class="stat-icon blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-info">
        <div class="num" id="statStatus">—</div>
        <div class="lbl">Current State</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <div class="stat-info">
        <div class="num" id="statFirstIn">—</div>

    </div>
    <div class="stat-card">
      <div class="stat-icon purple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div class="stat-info">
        <div class="num" id="statLastOut">—</div>
        <div class="lbl">Last Check-out</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div class="stat-info">
        <div class="num" id="statHours">—</div>
        <div class="lbl" id="statHoursLbl">Hours Today</div>
      </div>
    </div>
  </div>
  </div>

  <!-- Read-only Calendar View -->
  <div id="calendarView" class="hidden">
    <div class="section-header">
      <h2 class="section-title">Calendar</h2>
    </div>
    <div class="cal-card" id="calWrap"></div>
  </div>
</main>

<script>
const API = "{{ api }}";
const TZ  = "{{ tz }}";
const $ = (id) => document.getElementById(id);
const token = sessionStorage.getItem("token");
let me = null, today = null;

function logout() { sessionStorage.removeItem("token"); location.replace("/"); }
$("logout").addEventListener("click", logout);
if (!token) logout();

// Builds DOM with text nodes only, so server data is never interpreted as markup.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  e.append(...kids.flat().filter((x) => x != null && x !== false));
  return e;
}

function say(text, err) { const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (err ? " err" : ""); }

// Loads the enrolled face photo into an avatar element, leaving the initial-letter fallback in place on 404/error.
async function setAvatarPhoto(el, userId) {
  try {
    const res = await fetch(API + "/users/" + userId + "/photo", { headers: { Authorization: "Bearer " + token } });
    if (!res.ok) return;
    const url = URL.createObjectURL(await res.blob());
    el.style.backgroundImage = `url(${url})`;
    el.style.backgroundSize = "cover";
    el.style.backgroundPosition = "center";
    el.textContent = "";
  } catch {}
}

async function api(path) {
  let res;
  try { res = await fetch(API + path, { headers: { Authorization: "Bearer " + token } }); }
  catch { throw new Error("Cannot reach the server."); }
  if (res.status === 401) { logout(); throw new Error("Session expired."); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error((Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d) || "Request failed (" + res.status + ")");
  }
  return data;
}

// Dates arithmetic
const toDate  = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };

const timeFmt = new Intl.DateTimeFormat([], { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const dayFmt  = new Intl.DateTimeFormat([], { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" });
const parse   = (s) => new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s + "Z");
const fmtTime = (s) => (s ? timeFmt.format(parse(s)) : "—");
const fmtDay  = (s) => dayFmt.format(toDate(s));
const fmtDur  = (m) => (m == null ? "—" : Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m");

function minutesFor(rec, live) {
  if (!rec || !rec.first_check_in) return null;
  const start = parse(rec.first_check_in);
  const end = live ? new Date() : rec.last_check_out ? parse(rec.last_check_out) : null;
  return end && end > start ? Math.round((end - start) / 6e4) : null;
}

// Render Profile Header & Today Stats
function renderToday() {
  const t = today, live = t.is_checked_in;
  const state = live ? "Checked In" : t.last_check_out ? "Checked Out" : "Not Checked In";

  $("todayDate").textContent = "· " + fmtDay(t.work_date);

  // Live Status Badge in Profile Banner
  const badge = $("liveStatusBadge");
  badge.className = "status-badge-lg " + (live ? "in" : "out");
  $("liveStatusText").textContent = live ? "Currently Checked In" : state;

  // Stat cards
  $("statStatus").textContent = state;
  $("statFirstIn").textContent = fmtTime(t.first_check_in);
  $("statLastOut").textContent = live ? "—" : fmtTime(t.last_check_out);
  $("statHours").textContent = fmtDur(minutesFor(t, live));
  $("statHoursLbl").textContent = live ? "Hours (Live)" : "Hours Today";
}

// ============================================================================
// ---- Read-only Calendar (own attendance hours + holidays) ----
// ============================================================================
const CAL = { year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function fmtISODate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

// Shows plain "H:MM hrs" with no status words, per faculty-view calendar requirement.
function fmtHoursShort(m) {
  if (m == null) return null;
  return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + " hrs";
}

function qs(params) {
  return new URLSearchParams(Object.fromEntries(Object.entries(params).filter(([, v]) => v !== "" && v != null))).toString();
}

async function renderCalendar() {
  const daysInMonth = new Date(Date.UTC(CAL.year, CAL.month + 1, 0)).getUTCDate();
  const first = fmtISODate(CAL.year, CAL.month, 1);
  const last = fmtISODate(CAL.year, CAL.month, daysInMonth);
  const todayStr = today.work_date;
  const to = last > todayStr ? todayStr : last;

  let data = { items: [] }, holidaySettings = { saturday_holiday: false, sunday_holiday: true }, holidayList = [];
  try {
    const calls = [api("/holidays/settings"), api("/holidays?" + qs({ year: CAL.year }))];
    if (first <= to) calls.unshift(api("/attendance/me?date_from=" + first + "&date_to=" + to));
    const results = await Promise.all(calls);
    if (first <= to) { [data, holidaySettings, holidayList] = results; }
    else { [holidaySettings, holidayList] = results; }
  } catch (e) { say(e.message, true); }

  const byDate = new Map(data.items.map((i) => [i.work_date, i]));
  const holidayByDate = new Map(holidayList.map((hd) => [hd.date, hd]));
  const isHolidayDow = (dow) => (dow === 0 && holidaySettings.sunday_holiday) || (dow === 6 && holidaySettings.saturday_holiday);

  const startDow = new Date(Date.UTC(CAL.year, CAL.month, 1)).getUTCDay();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const grid = h("div", { class: "cal-grid" },
    ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => h("div", { class: "cal-dow" }, d)),
    cells.map((d) => {
      if (d == null) return h("div", { class: "cal-cell cal-empty" });
      const dateStr = fmtISODate(CAL.year, CAL.month, d);
      const dow = new Date(Date.UTC(CAL.year, CAL.month, d)).getUTCDay();
      const isHoliday = isHolidayDow(dow) || holidayByDate.has(dateStr);
      const isToday = dateStr === todayStr;
      const live = isToday && today.is_checked_in;
      const rec = byDate.get(dateStr);
      const hoursText = fmtHoursShort(minutesFor(rec, live));
      const isSelected = CAL.selected === dateStr;
      return h("div", {
        class: "cal-cell" + (isHoliday ? " cal-holiday" : "") + (isSelected ? " cal-selected" : "") + (isToday ? " cal-today" : ""),
        onclick: () => { CAL.selected = isSelected ? null : dateStr; renderCalendar(); }
      },
        h("div", { class: "cal-daynum" }, String(d)),
        hoursText ? h("div", { class: "cal-hours" }, hoursText) : null
      );
    })
  );

  const nav = h("div", { style: "display:flex;align-items:center;justify-content:space-between" },
    h("button", { type: "button", class: "cal-nav-btn", onclick: () => {
      CAL.month--; if (CAL.month < 0) { CAL.month = 11; CAL.year--; } CAL.selected = null; renderCalendar();
    } }, "←"),
    h("h3", { style: "margin:0;font-size:14px" }, `${MONTH_NAMES[CAL.month]} ${CAL.year}`),
    h("button", { type: "button", class: "cal-nav-btn", onclick: () => {
      CAL.month++; if (CAL.month > 11) { CAL.month = 0; CAL.year++; } CAL.selected = null; renderCalendar();
    } }, "→")
  );

  let detail;
  if (CAL.selected) {
    const rec = byDate.get(CAL.selected);
    const dow = new Date(CAL.selected + "T00:00:00Z").getUTCDay();
    const adhoc = holidayByDate.get(CAL.selected);
    const weekly = isHolidayDow(dow) ? (dow === 0 ? "Sunday" : "Saturday") : null;
    const live = CAL.selected === todayStr && today.is_checked_in;
    const hoursText = fmtHoursShort(minutesFor(rec, live));
    detail = h("div", { class: "cal-detail" },
      h("p", { style: "font-weight:600" }, fmtDay(CAL.selected)),
      rec
        ? [
            h("p", {}, "First check-in: " + fmtTime(rec.first_check_in)),
            h("p", {}, "Last check-out: " + (live ? "—" : fmtTime(rec.last_check_out))),
            h("p", { style: "font-weight:600" }, "Hours: " + (hoursText || "—"))
          ]
        : h("p", { class: "muted-text" }, weekly ? weekly + " (weekly holiday)" : adhoc ? adhoc.name : "No attendance record for this date.")
    );
  } else {
    detail = h("p", { class: "muted-text", style: "margin-top:12px" }, "Click a date to view check-in details.");
  }

  $("calWrap").replaceChildren(nav, grid, detail);
}

// Sidebar view switching (Dashboard / Calendar)
function setView(v) {
  document.querySelectorAll("#nav a[data-view]").forEach((a) => a.classList.toggle("on", a.dataset.view === v));
  $("dashboardView").classList.toggle("hidden", v !== "dashboard");
  $("calendarView").classList.toggle("hidden", v !== "calendar");
  if (v === "calendar") renderCalendar();
  closeDrawer();
}

// Drawer controls for mobile
const menuBtn = $("menu-toggle");
const sidebar = $("sidebar");
const backdrop = $("sidebar-backdrop");

function toggleDrawer() {
  sidebar.classList.toggle("open");
  backdrop.classList.toggle("open");
}
function closeDrawer() {
  sidebar.classList.remove("open");
  backdrop.classList.remove("open");
}
menuBtn.addEventListener("click", toggleDrawer);
backdrop.addEventListener("click", closeDrawer);

// Sidebar Nav Clicks
document.querySelectorAll("#nav a[data-view]").forEach((a) => {
  a.addEventListener("click", (e) => {
    e.preventDefault();
    setView(a.dataset.view);
  });
});

async function loadToday() {
  today = await api("/attendance/me/today");
  renderToday();
}

async function refresh() {
  try {
    await loadToday();
    if (!$("calendarView").classList.contains("hidden")) await renderCalendar();
  } catch (e) { say(e.message, true); }
}

(async function init() {
  try {
    me = await api("/users/me");
    if (me.role === "admin")  return location.replace("/admin");
    if (me.role === "system") return location.replace("/kiosk");

    // Populate Profile Banner
    const initial = (me.full_name || me.username || "U").charAt(0).toUpperCase();
    $("avatarInitial").textContent = initial;
    $("profileInitial").textContent = initial;
    $("profileName").textContent = me.full_name || me.username || "Staff Member";
    $("who").textContent = me.full_name;
    setAvatarPhoto($("avatarInitial"), me.id);
    setAvatarPhoto($("profileInitial"), me.id);

    $("profileDept").textContent = me.department ? me.department.name : "General";
    $("profileEmpId").textContent = me.employee_id ? "ID: " + me.employee_id : "No ID";
    $("profileFaceStatus").textContent = me.face_enrolled ? "✓ Face Enrolled" : "⚠ Face Setup Required";
    $("profileFaceStatus").style.color = me.face_enrolled ? "var(--success)" : "var(--warn)";

    if (!me.face_enrolled) {
      const notice = $("notice");
      notice.replaceChildren(
        "Face recognition is not set up yet — kiosk check-in won't recognize you. ",
        h("a", { href: "/?enroll=1" }, "Set up your face now")
      );
    }

    await loadToday();

    // Auto-refresh every 60s
    setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  } catch (e) { say(e.message, true); }
})();
</script>
